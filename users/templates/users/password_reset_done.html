{% extends 'base.html' %}

{% block title %}Письмо отправлено - PRO-инструмент{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4 text-center">
        <div class="card">
            <div class="card-body py-5">
                <i class="fas fa-envelope fa-4x mb-3" style="color: #28a745;"></i>
                <h4>Письмо отправлено</h4>
                <p class="text-muted">
                    Если email зарегистрирован — вы получите письмо со ссылкой для сброса пароля.
                    Проверьте папку «Спам», если не видите письмо.
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-danger mt-3">
                    Вернуться к входу
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
