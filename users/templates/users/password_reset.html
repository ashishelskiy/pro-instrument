{% extends 'base.html' %}
{% load static %}

{% block title %}Восстановление пароля - PRO-инструмент{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header" style="background-color: #d82a20; color: #fff;">
                <h4 class="mb-0">Восстановление пароля</h4>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3">
                    Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" id="id_email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn w-100" style="background-color: #d82a20; color: #fff;">
                        <i class="fas fa-paper-plane"></i> Отправить ссылку
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'users:login' %}" style="color: #d82a20;">← Вернуться к входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
