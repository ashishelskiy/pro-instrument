{% extends 'base.html' %}

{% block title %}Новый пароль - PRO-инструмент{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header" style="background-color: #d82a20; color: #fff;">
                <h4 class="mb-0">Новый пароль</h4>
            </div>
            <div class="card-body">
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn w-100" style="background-color: #d82a20; color: #fff;">
                            Сохранить пароль
                        </button>
                    </form>
                {% else %}
                    <div class="alert alert-danger">
                        Ссылка недействительна или устарела. Запросите сброс пароля снова.
                    </div>
                    <a href="{% url 'users:password_reset' %}" class="btn btn-danger w-100">
                        Запросить снова
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
