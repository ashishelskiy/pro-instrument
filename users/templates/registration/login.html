{% extends 'base.html' %}
{% load static %}

{% block title %}Вход - PRO-инструмент{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header" style="background-color: #d82a20; color: #fff;">
                <h4 class="mb-0">Вход в аккаунт</h4>
            </div>
            <div class="card-body">
                {% if form.errors %}
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i>
                        Неправильное имя пользователя или пароль.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Имя пользователя</label>
                        <input type="text" name="username" id="id_username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn w-100" style="background-color: #d82a20; color: #fff;">
                        Войти
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <p class="mb-2">
                        <a href="{% url 'users:password_reset' %}" style="color: #d82a20;">
                            Забыли пароль?
                        </a>
                    </p>
                    <p class="mb-0">
                        Нет аккаунта?
                        <a href="{% url 'users:register' %}" style="color: #d82a20;">Зарегистрироваться</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
