{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page.meta_title|default:page.title }}{% endblock %}
{% block description %}{{ page.meta_description|default:page.title }}{% endblock %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-lg-12">

            <h2 class="page-title">{{ page.title }}</h2>

            <div class="page-content">
                {{ page.content|safe }}
            </div>

        </div>
    </div>


<style>
    .page-content {
        font-size: 15px;
        line-height: 1.7;
        color: #333;
    }
    .page-content h2 {
        font-size: 1.4rem;
        margin-top: 24px;
        margin-bottom: 12px;
    }
    .page-content h3 {
        font-size: 1.2rem;
        margin-top: 20px;
        margin-bottom: 10px;
    }
    .page-content p {
        margin-bottom: 12px;
    }
    .page-content ul {
        margin: 12px 0;
        padding-left: 20px;
    }
    .page-content ul li {
        margin-bottom: 6px;
    }
</style>
{% endblock %}
