<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PRO-инструмент{% endblock %}</title>
    <meta name="description" content="{% block description %}Интернет-магазин профессионального инструмента{% endblock %}">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="{% url 'catalog:index' %}">
                    <img src="{% static 'images/logo.png' %}" alt="PRO-инструмент">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="btn-catalog" href="{% url 'catalog:category_list' %}">Каталог</a>
                        </li>
                    </ul>
                    <form class="d-flex" action="{% url 'catalog:search' %}" method="get">
                        <input class="form-control me-2" type="search" name="q" placeholder="Поиск..." aria-label="Поиск">
                        <button class="btn btn-outline-dark" type="submit">Найти</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <div class="container mt-4">
            {% if not request.resolver_match.url_name == 'index' %}
                {% block breadcrumbs %}
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'catalog:index' %}">Главная</a></li>
                        {% block breadcrumb_extra %}{% endblock %}
                    </ol>
                </nav>
                {% endblock %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="copyright">
                © 2015-2026 pro-instrument.ru
            </div>
            <div>
                <a href="{% url 'catalog:index' %}">Главная</a>
                <span style="margin: 0 10px; opacity: 0.5;">|</span>
                <a href="{% url 'catalog:category_list' %}">Каталог</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
