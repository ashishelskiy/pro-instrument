<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PRO-инструмент{% endblock %}</title>
    <meta name="description" content="{% block description %}Интернет-магазин профессионального инструмента{% endblock %}">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{% url 'catalog:index' %}">PRO-инструмент</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'catalog:category_list' %}">Каталог</a>
                        </li>
                    </ul>
                    <form class="d-flex" action="{% url 'catalog:search' %}" method="get">
                        <input class="form-control me-2" type="search" name="q" placeholder="Поиск..." aria-label="Поиск">
                        <button class="btn btn-outline-light" type="submit">Найти</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <div class="container mt-4">
            {% block breadcrumbs %}
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'catalog:index' %}">Главная</a></li>
                    {% block breadcrumb_extra %}{% endblock %}
                </ol>
            </nav>
            {% endblock %}

            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>PRO-инструмент</h5>
                    <p>Профессиональный инструмент для всех задач</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>© 2024 PRO-инструмент. Все права защищены.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
